services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: cartografo
      POSTGRES_USER: cartografo
      POSTGRES_PASSWORD: local-only-change-me
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartografo -d cartografo"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - cartografo-postgres:/var/lib/postgresql/data

volumes:
  cartografo-postgres:
