version: 1
updated_at: 2026-08-14
risks:
  - id: RISK-001
    threat: unauthorized source snapshot
    impact: critical
    control: explicit authorization record and tenant-scoped object key
    verification: CAP-ING-001
    residual_risk: authorization can be fraudulent; audit and deletion remain required
    owner: security
  - id: RISK-002
    threat: cross-tenant retrieval or cache result
    impact: critical
    control: RLS, namespace/filter, response validation, negative tests
    verification: CAP-TEN-001
    residual_risk: provider defects require stronger isolation for high-risk tenants
    owner: platform
  - id: RISK-003
    threat: generated answer invents file or line
    impact: high
    control: provenance validation, threshold, abstention, eval dataset
    verification: CAP-RAG-002
    residual_risk: cited evidence may still be interpreted incorrectly
    owner: ai-quality
  - id: RISK-004
    threat: interrupted workflow duplicates paid work or external effect
    impact: high
    control: durable intent hash, idempotency, checkpoint, reconciliation
    verification: CAP-AGT-001
    residual_risk: providers without lookup/idempotency weaken guarantees
    owner: reliability
  - id: RISK-005
    threat: secrets, code, or PII copied to telemetry
    impact: critical
    control: attribute allowlist, redaction, exporter tests, restricted retention
    verification: CAP-OBS-001
    residual_risk: dependency exception messages require continuous review
    owner: observability
  - id: RISK-006
    threat: release cannot restore data or roll back safely
    impact: critical
    control: backup, restore, canary, compatible migration, rollback game day
    verification: CAP-DR-001
    residual_risk: disaster modes beyond the exercised scenario remain
    owner: operations
  - id: RISK-007
    threat: model/provider dependency becomes lock-in or unavailable
    impact: medium
    control: domain port, fake, contract suite, capability-aware fallback
    verification: CAP-LLM-001
    residual_risk: equivalent quality/capability may not exist elsewhere
    owner: architecture
  - id: RISK-008
    threat: public material contains fabricated performance or value claims
    impact: high
    control: evidence IDs and launch claim checker
    verification: CAP-LCH-001
    residual_risk: qualitative wording still requires human review
    owner: product
