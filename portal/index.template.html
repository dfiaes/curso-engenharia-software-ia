<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Do júnior ao especialista: curso de Engenharia de Software e IA com Python.">
<title>Curso · Engenharia de Software e IA</title>
<script>try{var t=localStorage.getItem("curso.theme");if(t)document.documentElement.dataset.theme=t}catch(e){}window.Course=window.Course||{ready:function(f){(window.__courseQ=window.__courseQ||[]).push(f)}};</script>
<link rel="stylesheet" href="assets/course.css">
<style>
.p-top{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:12px;height:56px;padding:0 clamp(16px,4vw,40px);background:var(--surface);border-bottom:1px solid var(--line)}
.p-top strong{flex:1;font-size:1rem}
.p-wrap{max-width:1120px;margin:0 auto;padding:24px clamp(16px,4vw,40px) 80px}
.p-hero h1{margin:.3em 0}
.p-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin:16px 0 28px;padding:0;list-style:none}
.p-card{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:var(--surface);color:var(--fg);text-decoration:none}
.p-card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.p-card h3{margin:0;font-size:1.02rem}
.p-card p{margin:0;font-size:.92rem;color:var(--muted)}
.p-code{font:700 .75rem var(--mono);color:var(--accent)}
.p-hl{border-left:4px solid var(--accent);background:var(--accent-soft)}
.p-bar{height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.p-bar span{display:block;height:100%;background:var(--ok)}
.p-small{font-size:.8rem;color:var(--muted)}
.p-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}
.p-tools input[type=search]{flex:1;min-width:200px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit}
.p-btn{padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit;cursor:pointer}
.p-btn:hover{border-color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--info);outline-offset:2px}
@media (max-width:600px){.p-grid{grid-template-columns:1fr}}
</style>
</head>
<body data-layout="none">
<a class="skip-link" href="#main">Ir para o conteúdo</a>
<header class="p-top">
  <strong>Engenharia de Software + IA</strong>
  <button class="c-iconbtn c-theme" type="button" aria-label="Alternar tema"></button>
</header>
<main id="main" class="p-wrap" tabindex="-1">
  <section class="p-hero" aria-labelledby="h-hero">
    <h1 id="h-hero">Do júnior ao especialista em Engenharia de Software e IA</h1>
    <p class="lead" id="hero-sub"></p>
  </section>

  <section aria-labelledby="h-feat">
    <h2 id="h-feat">Comece por aqui</h2>
    <ul class="p-grid" id="featured"></ul>
  </section>

  <section aria-labelledby="h-curr">
    <h2 id="h-curr">Currículo em cinco fases</h2>
    <div class="p-tools" role="search">
      <label for="q" class="p-small">Filtrar módulos</label>
      <input id="q" type="search" placeholder="Código, título ou tema" autocomplete="off">
      <button class="p-btn" id="export" type="button">Exportar progresso</button>
      <label class="p-btn" for="import">Importar progresso</label>
      <input id="import" type="file" accept="application/json,.json" hidden>
    </div>
    <p id="msg" class="small" role="status" aria-live="polite"></p>
    <p id="empty" class="small" hidden>Nenhum módulo encontrado.</p>
    <div id="phases"></div>
  </section>
</main>
<script src="assets/course-manifest.js"></script>
<script src="portal/progress.js"></script>
<script src="assets/course.js" data-unit="" defer></script>
<script src="portal/portal.js" defer></script>
</body>
</html>
