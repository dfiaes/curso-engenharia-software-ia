# Instalar: pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: protected-paths
        name: bloquear caminhos protegidos
        entry: python3 scripts/hooks/block_protected_paths.py --staged
        language: system
        pass_filenames: false
        always_run: true
      - id: no-test-edits-in-fix
        name: bloquear edição de testes em branch fix/
        entry: python3 scripts/hooks/block_test_edits_in_fix.py --staged
        language: system
        pass_filenames: false
        always_run: true
      - id: scan-secrets
        name: procurar segredos no diff
        entry: python3 scripts/hooks/scan_secrets.py --staged
        language: system
        pass_filenames: false
        always_run: true
