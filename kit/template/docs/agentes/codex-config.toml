# Trecho para ~/.codex/config.toml (ou .codex/config.toml em projeto confiável).
# O Codex não lê este arquivo daqui: copie as tabelas abaixo para a config dele.
# Nenhum segredo literal: tokens só por variável de ambiente.

[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@latest", "--isolated"]
startup_timeout_sec = 30

# MCP de Jira (Atlassian). A autenticação padrão é OAuth: rode `codex mcp login atlassian`.
[mcp_servers.atlassian]
url = "https://mcp.atlassian.com/v2/mcp"
enabled = false
# Se usar token em vez de OAuth, passe o NOME da variável (nunca o valor):
# bearer_token_env_var = "ATLASSIAN_MCP_TOKEN"
# Limite o que o agente pode chamar:
# enabled_tools = ["searchJiraIssuesUsingJql", "getJiraIssue"]
