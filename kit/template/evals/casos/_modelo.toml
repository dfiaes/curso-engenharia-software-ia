# Modelo de caso (arquivos que começam com "_" são ignorados). Um caso por arquivo.
id = "meu-caso"                       # único; nome do arquivo = id é uma boa regra
descricao = "O que este caso prova, em uma frase"
tags = ["bugfix", "dotnet"]           # usadas em --casos <tag>
dificuldade = "media"                 # facil | media | dificil
prompt = "Instrução exatamente como você daria ao agente."
fixture = "../fixtures/meu-caso"      # opcional; pasta copiada para um workdir temporário a cada execução
deve_acionar_skill = true             # opcional; true/false para testar acionamento (falso positivo/negativo)

[verificar]                           # use ao menos um; todos os informados precisam passar
comando = "dotnet test --nologo"      # shell no workdir; sucesso = exit 0
# regex_saida = "Todos os testes passaram"   # regex sobre a saída do agente
# arquivos_esperados = ["docs/adr/0001.md"]  # caminhos que devem existir no workdir
