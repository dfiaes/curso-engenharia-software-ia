# env = { CLAUDE_CONFIG_DIR = "$HOME/.claude-com-skill" }   # exemplo: diretório de config com a skill instalada
# [variante.sem_skill]
# env = { CLAUDE_CONFIG_DIR = "$HOME/.claude-sem-skill" }

