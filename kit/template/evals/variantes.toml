# Variantes REAIS do seu projeto. Descomente/adapte uma por modelo/agente que quer comparar.
# Vale para todas: segredos NUNCA aqui, só referência a variável de ambiente (ex.: "$ANTHROPIC_API_KEY").
# Placeholders do `comando`: {prompt_file} (arquivo com o prompt do caso) e {workdir} (cópia temporária da fixture,
# que também é o diretório de execução). Variáveis exportadas: $PYTHON, $EVALS_DIR, $EVAL_CASO_ID,
# $EVAL_DIFICULDADE, $EVAL_TENTATIVA, $EVAL_VARIANTE, $EVAL_MODELO, $EVAL_SKILL_MODO (só no --skill-ab).
#
# ATENÇÃO: as flags abaixo são exemplos; CONFIRA NA DOC DA SUA VERSÃO (mudam entre releases).
# Para extrair uso de tokens, use `regex_tokens` com grupos (?P<entrada>..) e (?P<saida>..) sobre a saída do agente
# (muitas CLIs têm um modo JSON/verbose com o uso). Sem isso o custo aparece como "n/d".
# `regex_acionamento_skill`: padrão que prova que a skill foi usada (ex.: a skill manda imprimir "[skill:minha-skill]").
# Para --skill-ab, declare [variante.com_skill] e [variante.sem_skill] (env, ou comando alternativo).

[config]
tolerancia_pass_k = 0.05

