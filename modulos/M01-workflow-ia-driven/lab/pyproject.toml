[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "m01-sdd-lab"
version = "0.1.0"
description = "Laboratório seguro e agnóstico de specification-driven development"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
sdd-lab = "sdd_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sdd_lab"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

