[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "work-intake"
version = "0.1.0"
description = "Vertical slice local do laboratório M02A"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
  "jsonschema>=4.25,<5",
  "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "hatchling>=1.27,<2",
  "hypothesis>=6.140,<7",
  "mypy>=1.18,<2",
  "pytest>=9,<10",
  "ruff>=0.14,<1",
  "types-jsonschema>=4.25,<5",
]

[project.scripts]
work-intake = "work_intake.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["python/src/work_intake"]

[tool.hatch.build.targets.sdist]
include = ["python", "contracts", "fixtures", "pyproject.toml"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["python/src", "python/tests", "tools"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["python/tests"]
