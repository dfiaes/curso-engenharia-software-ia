[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "design-code-lab"
version = "0.1.0"
description = "Lab S01: characterization tests, a strategy-based refactoring of a legacy pricing function and a small TDD kata"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Curso Engenharia de IA" }]
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/design_lab"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# legado.py is deliberately written the way real legacy code is written.
"src/design_lab/legado.py" = ["SIM102", "SIM108", "SIM114", "SIM116"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
