[project]
name = "lt01-b01-b02-b03-b04-b05-b06-lab"
version = "0.6.0"
description = "Laboratório LT01-B01/B02/B03/B04/B05/B06: event loop, shutdown, zombies, FD, paths, execução confinada, resolução local, TCP, TLS, pool, deadline, cancelamento, carga/tempo, RSS, percentis/cardinalidade, incidente, runbook e restauração"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Curso Engenharia de IA" }]
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["bloqueio_event_loop.py", "shutdown_gracioso.py", "coleta_zumbis.py", "vazamento_fd.py", "caminho_seguro.py", "execucao_confinada.py", "resolucao_local.py", "conexao_tcp.py", "tls_local.py", "pool_local.py", "deadline_fases.py", "cancelamento_cooperativo.py", "carga_tempo.py", "memoria_rss.py", "percentis_cardinalidade.py", "registro_incidente.py", "exercicio_runbook.py", "restauracao_baseline.py", "tests"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
