[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "m00-harness-lab"
version = "0.1.0"
description = "Laboratório agnóstico de contrato, contexto e menor privilégio para harnesses de IA"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = [
  "mypy>=1.17,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
harness-lab = "harness_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_lab"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

