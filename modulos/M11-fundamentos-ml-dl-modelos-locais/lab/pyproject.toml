[project]
name = "m11-lab"
version = "0.1.0"
description = "Laboratório do M11: tensores, transformer mínimo e modelos locais"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Curso Engenharia de IA" }]
dependencies = ["torch==2.9.1"]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["metrics.py", "regressao.py", "nao_linear.py", "atencao.py", "custo_quadratico.py", "multihead.py", "gpt.py", "treinar.py", "bpe_mini.py", "amostragem.py", "template_chat.py", "abstencao.py", "orcamento_vram.py", "licencas.py", "provedor_local.py", "dimensionar_local.py", "custo_local.py", "matriz_local.py", "create_working_copy.py", "tests"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
