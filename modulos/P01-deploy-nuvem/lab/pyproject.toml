[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "deploy-lab"
version = "0.1.0"
description = "Lab P01: an LLM-backed FastAPI service plus a static production-readiness checker for its Dockerfile, Bicep and GitHub Actions workflow"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Curso Engenharia de IA" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "opentelemetry-api>=1.30,<2",
  "pyyaml>=6,<7",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
# Only needed when the service talks to Azure for real; the lab never imports them.
azure = [
  "azure-identity>=1.19,<2",
  "azure-monitor-opentelemetry>=1.6,<2",
]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "opentelemetry-sdk>=1.30,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
  "types-pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_service", "src/deploycheck"]

[project.scripts]
deploycheck = "deploycheck.cli:main"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
