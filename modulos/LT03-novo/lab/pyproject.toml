[project]
name = "lt03-b01-lab"
version = "0.1.0"
description = "Laboratório LT03-B01: artefato OCI, drenagem/grace e decisão de portabilidade/custo (só stdlib, sem Docker/rede)"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Curso Engenharia de IA" }]
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["validar_dockerfile.py", "drenagem_grace.py", "validar_manifesto.py", "simular_rollout.py", "sinais_escala.py", "estado_iac.py", "reconciliar_gitops.py", "analisar_canary.py", "tests"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
