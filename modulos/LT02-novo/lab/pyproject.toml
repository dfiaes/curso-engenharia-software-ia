[project]
name = "lt02-b01-lab"
version = "0.1.0"
description = "Laboratório LT02-B01: falha parcial, tempo, ordem e consistência — barramento fake determinístico com partição controlada, escrita sob partição e duas leituras"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Curso Engenharia de IA" }]
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["barramento_fake.py", "escrita_sob_particao.py", "leituras_consistencia.py", "fila_limitada.py", "particao_por_chave.py", "quarentena_schema.py", "outbox_sqlite.py", "repositorio_idempotente.py", "coordenador_workers.py", "reconciliador.py", "orcamento_retry.py", "guarda_deadline.py", "saga_compensavel.py", "dlq_replay.py", "isolamento_niveis.py", "replica_atrasada.py", "pitr_journal.py", "backup_verificado.py", "registro_incidente.py", "rastro_mensagem.py", "runbook_degradacao.py", "prova_restauracao.py", "tests"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
