[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "capstone-lab"
version = "0.1.0"
description = "M13 B1-B5: baseline do Cartógrafo (ingestão idempotente, parsers, dados locais)"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/capstone_lab"]

[tool.ruff]
target-version = "py314"
line-length = 100
# fixtures/golden contém erros sintáticos de propósito (corpus de falha do B4)
extend-exclude = ["fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
