[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "csv-cleaner"
version = "0.1.0"
description = "Laboratório executável do M02: Python profissional para engenharia sênior"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Curso Engenharia de IA" }]
dependencies = [
  "pydantic>=2.11,<3",
]

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "hypothesis>=6.130,<7",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
csv-cleaner = "python_senior_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/python_senior_lab"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "contracts", "fixtures", "README.md", "pyproject.toml"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
exclude = ["fixtures/generated_defects"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "distribution: constrói ou inspeciona artefatos de distribuição",
]
