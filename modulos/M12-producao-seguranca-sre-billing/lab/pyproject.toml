[project]
name = "m12-production-lab"
version = "0.1.0"
description = "Vendor-neutral security, tenancy, reliability, billing, and SRE lab"
requires-python = ">=3.14"
dependencies = [
  "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]
postgres = [
  "asyncpg>=0.30,<1",
  "testcontainers[postgres]>=4.12,<5",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["postgres: requires Docker and PostgreSQL 18"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["m12_lab"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m12_lab"]
