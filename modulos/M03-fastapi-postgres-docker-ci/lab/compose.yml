# Ambiente local do laboratório M03 (lote B05).
# Necessita Docker Engine/Compose para executar; sem ele, os oráculos
# estáticos (tests/test_packaging.py) verificam estes artefatos.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: shortener
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [shortnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports: ["8000:8000"]
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://postgres:dev@db:5432/shortener
    depends_on:
      db:
        condition: service_healthy
    networks: [shortnet]

volumes:
  pgdata:

networks:
  shortnet:
