# Registro de um assistente de atendimento com RAG. Esperado: nenhuma lacuna.
id: assistente-atendimento
name: Assistente de atendimento ao cliente
owner: maria.souza@example.com
purpose: Responder dúvidas de clientes sobre faturas e planos usando a base de ajuda aprovada.
lifecycle: production
risk_tier: limited
risk_rationale: Chatbot que conversa com pessoas e não decide sobre direitos; exige aviso de IA.
personal_data:
  processes: true
  categories: [nome, cpf, e-mail]
  sensitive: false
  children: false
legal_basis: contract
stores:
  - kind: prompt_log
    holds_personal_data: true
    retention_days: 30
    erasure_supported: true
  - kind: vector_store
    holds_personal_data: false
    retention_days: 365
    erasure_supported: true
provider:
  name: ProvedorExemplo
  country: US
  trains_on_inputs: false
  transfer_mechanism: clausulas-padrao-anpd-res-19-2024
assessments:
  - {kind: dpia, done_on: 2026-06-20, reference: RIPD-2026-014}
  - {kind: eval_report, done_on: 2026-09-15, reference: EVAL-2026-077}
  - {kind: red_team, done_on: 2026-09-01, reference: RT-2026-009}
  - {kind: model_card, done_on: 2026-09-15, reference: MC-assistente-v3}
automated_decision: false
human_review: true
user_facing_generative: true
ai_disclosure: true
incident_plan: runbooks/incidente-ia-atendimento.md
eu_exposure: false
