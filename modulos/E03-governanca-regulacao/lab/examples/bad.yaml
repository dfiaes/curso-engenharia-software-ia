# Registro de uma triagem de currículos. Esperado: várias lacunas.
id: triagem-curriculos
name: Triagem automática de currículos
owner: rh-tech
purpose: Ordenar candidatos por aderência à vaga e descartar os de menor pontuação.
lifecycle: production
risk_tier: high
risk_rationale: Seleção de candidatos a emprego é caso de uso de alto risco no EU AI Act.
personal_data:
  processes: true
  categories: [nome, cpf, saude, origem-racial]
  sensitive: true
  children: false
legal_basis: legitimate_interest
stores:
