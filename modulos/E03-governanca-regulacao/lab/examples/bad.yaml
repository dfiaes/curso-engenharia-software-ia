    holds_personal_data: true
    erasure_supported: false
  - kind: vector_store
    holds_personal_data: true
    retention_days: 730
    erasure_supported: false
  - kind: finetune_dataset
    holds_personal_data: true
    retention_days: 1095
    erasure_supported: false
provider:
  name: ProvedorExemplo
  country: US
  trains_on_inputs: true
assessments:
  - {kind: eval_report, done_on: 2025-03-01, reference: EVAL-2025-004}
automated_decision: true
human_review: false
user_facing_generative: false
ai_disclosure: false
eu_exposure: true
