name: course-core

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: course-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Course structure and portal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"
      - name: Record command context
        run: |
          python --version
          uv --version
          git rev-parse HEAD
      - name: Run local-equivalent source checks
        run: |
          python tools/build_course_portal.py --check
          python -m unittest tools/test_course_portal.py tools/test_check_course.py -v
          node tools/test_portal_progress.js
          python tools/check_course.py
